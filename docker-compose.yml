# ============================================================
# MiniSaaS ERP 一键编排：后端(3000) + 前端(8080, Nginx)
# 用法: docker compose up --build
# 访问: http://localhost:8080 （登录 admin / admin123）
# ============================================================
services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: 'file:./dev.db'
      # 生产环境务必替换为强随机密钥
      JWT_SECRET: 'please-change-me-$(openssl rand -hex 16 2>/dev/null || echo dev-only)'
      CORS_ORIGINS: 'http://localhost:8080'
    volumes:
      # 持久化 SQLite 数据
      - erp-data:/app/prisma
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  erp-data:
