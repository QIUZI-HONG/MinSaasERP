# ============================================================
# Render Blueprint —— MiniSaaS ERP 一键部署配置
#
# 使用方法：
#   1. 在 https://neon.tech 创建免费 PostgreSQL 数据库，复制连接串
#   2. 打开 https://dashboard.render.com/blueprints 选择本仓库
#   3. 填入环境变量后 Apply（或先 Apply 再到各服务 Settings 中配置）
#   4. 部署完成后把前端 URL 填到后端 CORS_ORIGINS，把后端 URL 填到前端
#      VITE_API_BASE_URL 后重新部署前端
# ============================================================

services:
  # ---------- 后端 API ----------
  - type: web
    name: minierp-api
    runtime: node
    plan: free
    rootDirectory: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon PostgreSQL 连接串，例如：
      # postgresql://user:password@ep-xxx.neon.tech/minierp?sslmode=require
      - key: DATABASE_URL
        sync: false
      # JWT 签名密钥（自动生成强随机值）
      - key: JWT_SECRET
        generateValue: true
      # CORS 白名单：部署后填前端地址，例如 https://minierp-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 10000

  # ---------- 前端静态站点 ----------
  - type: web
    name: minierp-web
    runtime: static
    plan: free
    rootDirectory: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # 后端 API 地址（构建时注入），例如 https://minierp-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
